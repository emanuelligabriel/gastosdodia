<style>
/* Layout: extrato de bolso. Uma coluna estreita, número grande no topo, abas fixas embaixo. */
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --surface2:#E8EEEB; --ink:#13201C; --muted:#5A6A64; --line:#D5DDD8;
  --accent:#0B6E5B; --accent-ink:#FFFFFF; --accent-soft:#D9EEE8;
  --pos:#1B7A48; --neg:#B3261E; --neg-soft:#F8DEDB; --warn:#8A5A00; --warn-soft:#FBEBC8;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif; --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1311; --surface:#141D1A; --surface2:#1B2723; --ink:#E7EFEB; --muted:#92A59D; --line:#25342F;
  --accent:#4CC3A8; --accent-ink:#04201A; --accent-soft:#16332C;
  --pos:#62D191; --neg:#FF8F86; --neg-soft:#3A1D1B; --warn:#E5B755; --warn-soft:#3A2D10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1311; --surface:#141D1A; --surface2:#1B2723; --ink:#E7EFEB; --muted:#92A59D; --line:#25342F;
  --accent:#4CC3A8; --accent-ink:#04201A; --accent-soft:#16332C;
  --pos:#62D191; --neg:#FF8F86; --neg-soft:#3A1D1B; --warn:#E5B755; --warn-soft:#3A2D10; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 96px;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin-inline:auto}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
h1,h2,h3{margin:0;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:calc(14px) 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.top .app{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:13px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg,.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pos);margin-right:6px}
.dot.off{background:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-block:12px}
.card.hero{padding:20px 18px 14px}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,11vw,54px);line-height:1.05;letter-spacing:-.02em;margin-block:6px 4px}
.big.neg{color:var(--neg)}
.hint{color:var(--muted);font-size:13.5px;max-width:52ch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .card{margin-block:0}
.grid2>*{min-width:0}
.stat .v{overflow-wrap:anywhere}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em;margin-top:4px}
.stat .s{color:var(--muted);font-size:12.5px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.alert{border-radius:14px;padding:12px 14px;margin-block:12px;background:var(--neg-soft);color:var(--neg);font-weight:600;font-size:14px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.ok{background:var(--accent-soft);color:var(--accent)}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-block:12px}
.btn{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 12px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-block:20px 6px}
.sec-title h2{font-family:var(--f-display);font-size:18px;letter-spacing:-.01em}
.sec-title span{color:var(--muted);font-size:13px}
.list{margin:0;padding:0;list-style:none}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:700;white-space:nowrap}
.row.tap{cursor:pointer;background:none;border:0;border-bottom:1px dashed var(--line);width:100%;text-align:left}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:6px;padding:2px 6px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.cc{background:var(--warn-soft);color:var(--warn);border:0;margin:0;padding:2px 6px;display:inline}
.tag.in{background:var(--accent-soft);color:var(--accent)}
.tag.bad{background:var(--neg-soft);color:var(--neg)}
.alert .btn{margin-top:10px;background:var(--surface);color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chips .btn{min-height:40px}
.day{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-block:14px 0}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
svg.chart text{fill:var(--muted);font-family:var(--f-body);font-size:10px}
.empty{color:var(--muted);padding:18px 4px;text-align:center}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.nav .in{max-width:640px;margin-inline:auto;display:grid;grid-template-columns:repeat(6,1fr)}
.legend{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface2);margin:8px 0}
.ins{border-left:4px solid var(--accent);padding:2px 0 2px 12px;margin-block:12px}
.ins.warn{border-color:var(--warn)}.ins.bad{border-color:var(--neg)}
.ins b{display:block}
.ins span{color:var(--muted);font-size:13.5px}
.nav button{background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);min-height:56px}
.nav button[aria-current="true"]{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(72px + env(safe-area-inset-bottom,0px));min-height:52px;padding-inline:18px;border-radius:99px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:5}
label.f{display:block;margin-block:12px 0;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=date],input[type=number],select{display:block;width:100%;min-height:46px;margin-top:5px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface2);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;min-height:40px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
input[type=date]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none}
.backdrop{position:fixed;inset:0;background:rgba(5,12,10,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-family:var(--f-display);font-size:20px;margin-bottom:2px}
.sheet .btns{display:grid;gap:10px;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.mrow{border-bottom:1px dashed var(--line)}
.mrow:last-child{border-bottom:0}
.mhead{width:100%;background:none;border:0;text-align:left;padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.mhead .mn{font-weight:700;text-transform:capitalize}
.mhead .ms{color:var(--muted);font-size:12.5px}
.drow{display:grid;grid-template-columns:62px 1fr 1fr 1fr;gap:6px;font-size:12.5px;padding:5px 0;color:var(--muted)}
.drow b{color:var(--ink);font-weight:600}
.drow.h{font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:11px}
.skel{height:120px;border-radius:16px;background:var(--surface2);margin-block:12px}
.fixrow{display:grid;grid-template-columns:1fr 62px 96px 40px;gap:6px;align-items:center;margin-top:8px}
.fixrow input{margin-top:0;min-height:42px;padding:6px 8px;font-size:15px}
.xbtn{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.xbtn.sure{color:var(--neg);border-color:var(--neg);font-size:12px}
.demo{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;margin-block:8px;font-size:13.5px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:space-between}
.demo button{background:var(--warn);color:var(--warn-soft);border:0;border-radius:8px;padding:6px 10px;font-weight:700;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
@media (max-width:380px){.actions{grid-template-columns:1fr}.fixrow{grid-template-columns:1fr 54px 84px 36px}}
</style>

<script>
/*LOGIC-START*/
const MS=86400000;
const DOW=['dom','seg','ter','qua','qui','sex','sáb'];
const MON=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MONF=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const dnOf=(y,m,d)=>Math.round(Date.UTC(y,m,d)/MS);
const parseISO=s=>{if(!s||typeof s!=='string')return null;const p=s.split('-').map(Number);if(p.length<3||p.some(isNaN))return null;return dnOf(p[0],p[1]-1,p[2]);};
const ymd=n=>{const t=new Date(n*MS);return{y:t.getUTCFullYear(),m:t.getUTCMonth(),d:t.getUTCDate(),w:t.getUTCDay()};};
const toISO=n=>{const o=ymd(n);return o.y+'-'+String(o.m+1).padStart(2,'0')+'-'+String(o.d).padStart(2,'0');};
const dim=(y,m)=>new Date(Date.UTC(y,m+1,0)).getUTCDate();
const todayDn=()=>{const t=new Date();return dnOf(t.getFullYear(),t.getMonth(),t.getDate());};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// chama cb(dn) para o dia `day` de cada mês entre start e end (dia 29-31 vira o último dia do mês curto)
function monthly(start,end,day,cb){
  if(!day||start>end)return;
  const s=ymd(start);let y=s.y,m=s.m;
  for(let guard=0;guard<80;guard++){
    const n=dnOf(y,m,Math.min(day,dim(y,m)));
    if(n>end)break;
    if(n>=start)cb(n);
    m++;if(m>11){m=0;y++;}
    if(dnOf(y,m,1)>end)break;
  }
}
function parcelDates(p){
  const f=parseISO(p.primeira);if(f==null||!(p.n>=1))return[];
  const o=ymd(f),out=[];
  for(let k=0;k<p.n;k++){const mm=o.m+k;const y=o.y+Math.floor(mm/12),m=((mm%12)+12)%12;out.push(dnOf(y,m,Math.min(o.d,dim(y,m))));}
  return out;
}
// categorias que descontam do gasto diário previsto
const DAILY=new Set(['Diário','Alimentação','Transporte','Lazer']);
function guessCat(nome,card){
  const t=norm(nome);
  let R=[[/aluguel|moradia|condominio|financiamento|iptu/,'Moradia'],[/\bluz\b|energia|agua|saneamento|internet|\bgas\b|telefone|celular|\btim\b|\bvivo\b|\bclaro\b/,'Contas'],[/netflix|spotify|disney|prime|hbo|youtube|icloud|assinatura|globoplay|deezer|apple/,'Assinaturas'],[/mercado|supermercado|feira|atacado|acougue|padaria/,'Mercado'],[/academia|plano de saude|saude|farmacia|dentista|medico|terapia|unimed/,'Saúde'],[/faculdade|curso|escola|mensalidade|livro|udemy/,'Educação'],[/uber|\b99\b|gasolina|combustivel|onibus|metro|estacionamento|ipva|carro|moto/,'Transporte'],[/restaurante|ifood|lanche|pizza|cafe/,'Alimentação'],[/cinema|viagem|show|ingresso|lazer|parque/,'Lazer']];
  if(card)R=R.filter(r=>r[1]!=='Contas'&&r[1]!=='Moradia');
  for(const r of R)if(r[0].test(t))return r[1];
  return card?'Compras':'Outros';
}
function compute(cfg,parcelas,lanc,fech){
  const start=parseISO(cfg.saldoData)??todayDn();
  const so=ymd(start);
  const end=dnOf(so.y,so.m+13,0);
  const H=end-start+1;
  const A=()=>new Float64Array(H);
  const ent=A(),fix=A(),parc=A(),fac=A(),res=A(),out=A(),dall=A();
  const events=[];
  const add=(arr,dn,v)=>{const i=dn-start;if(i>=0&&i<H)arr[i]+=v;};
  // quebra dos gastos por categoria, por origem e por categoria do cartão, mês a mês
  const CI=new Map();
  const bump=(kind,dn,name,v)=>{if(!(v>0))return;const o=ymd(dn),key=o.y*12+o.m;let m=CI.get(key);if(!m){m={cats:{},orgs:{},card:{},cards:{}};CI.set(key,m);}const t=kind==='c'?m.cats:kind==='o'?m.orgs:kind==='w'?m.cards:m.card;t[name]=(t[name]||0)+v;};
  if(cfg.renda>0)monthly(start,end,cfg.diaSalario,n=>{add(ent,n,cfg.renda);events.push({dn:n,label:'Salário',valor:cfg.renda,kind:'in'});});
  if(cfg.reserva>0)monthly(start,end,cfg.diaSalario,n=>{add(res,n,cfg.reserva);events.push({dn:n,label:'Reserva do mês',valor:cfg.reserva,kind:'res'});});
  (cfg.fixas||[]).forEach(f=>{if(f.valor>0)monthly(start,end,f.dia,n=>{add(fix,n,f.valor);events.push({dn:n,label:f.nome||'Conta fixa',valor:f.valor,kind:'fix'});bump('c',n,f.cat||guessCat(f.nome),f.valor);bump('o',n,'Contas fixas',f.valor);});});
  (cfg.recorrentes||[]).forEach(r=>{if(r.valor>0)monthly(start,end,r.dia,n=>{add(ent,n,r.valor);events.push({dn:n,label:r.nome||'Entrada recorrente',valor:r.valor,kind:'in'});});});
  const fc=cfg.fac;
  if(fc&&fc.valor>0){
    const a=parseISO(fc.ini),b=parseISO(fc.fim);
    monthly(Math.max(start,a??start),Math.min(end,b??end),fc.dia,n=>{add(fac,n,fc.valor);events.push({dn:n,label:'Faculdade',valor:fc.valor,kind:'fac'});bump('c',n,'Educação',fc.valor);bump('o',n,'Faculdade',fc.valor);});
  }
  (parcelas||[]).forEach(p=>{parcelDates(p).forEach((n0,k)=>{
    const pg=p.pagas&&p.pagas[k],n=pg?(parseISO(pg.d)??n0):n0,v=pg?(Number(pg.v)||0):p.valor;
    if(n>=start&&n<=end){add(parc,n,v);events.push({dn:n,label:(p.nome||'Parcela')+' '+(k+1)+'/'+p.n+(pg&&Math.abs(v-p.valor)>0.005?' (antecipada)':''),valor:v,kind:'card'});const pc=p.cat||guessCat(p.nome,true);bump('c',n,pc,v);bump('o',n,'Cartão',v);bump('k',n,pc,v);bump('w',n,(p.cartao||'').trim()||'Sem cartão informado',v);}
  });});
  (lanc||[]).forEach(l=>{
    const n=parseISO(l.data);if(n==null||n<start||n>end)return;
    // no dia do saldo informado, o que foi lançado ANTES da atualização já está dentro do saldo
    const counted=!(n===start&&l.ts&&cfg.saldoTs&&l.ts<=cfg.saldoTs);
    if(l.tipo==='receita'){if(counted){add(ent,n,l.valor);events.push({dn:n,label:l.desc||'Entrada',valor:l.valor,kind:'in'});}}
    else{
      const fromRes=l.fonte==='reserva',fromCard=l.fonte==='cartao';
      if(counted&&!fromRes)add(out,n,l.valor);                    // gasto pago com a reserva não mexe na conta corrente
      if(DAILY.has(l.cat)&&!fromRes)dall[n-start]+=l.valor;
      if(l.cat!=='Reserva'){bump('c',n,l.cat||'Outros',l.valor);bump('o',n,fromRes?'Reserva de emergência':fromCard?'Cartão':'Débito/Pix',l.valor);if(fromCard){bump('k',n,l.cat||'Outros',l.valor);bump('w',n,(l.cartao||'').trim()||'Sem cartão informado',l.valor);}}
    }
  });

    days.push({dn:start+i,ent:ent[i],fix:fix[i],parc:parc[i],fac:fac[i],res:res[i],gd,out:out[i],saidas,liquido,saldo:s});
  }

  days.forEach((d,i)=>{

  });

  return{start,end,H,days,events,months};
}
function minFrom(c,i0,i1){let mn=Infinity,mi=i0;const e=Math.min(i1??c.H-1,c.H-1);for(let i=i0;i<=e;i++){if(c.days[i].saldo<mn){mn=c.days[i].saldo;mi=i;}}return{v:mn,i:mi};}
function maxAvista(c,idx,folga){return Math.max(0,minFrom(c,clamp(idx,0,c.H-1)).v-(folga||0));}
function simulate(c,sim,folga){
  const extra=new Float64Array(c.H);
  const n=Math.max(1,Math.round(sim.n||1));
  if(sim.valor>0&&sim.data){
    parcelDates({primeira:sim.data,n}).forEach(d=>{const i=d-c.start;if(i>=0&&i<c.H)extra[i]+=sim.valor/n;});
  }
  const com=[];let cum=0;
  for(let i=0;i<c.H;i++){cum+=extra[i];com.push(c.days[i].saldo-cum);}
  let mnCom=Infinity,miCom=0,firstNeg=-1;
  for(let i=0;i<c.H;i++){if(com[i]<mnCom){mnCom=com[i];miCom=i;}if(firstNeg<0&&com[i]<0)firstNeg=i;}
  const sem=minFrom(c,0);
  return{com,mnCom,miCom,firstNeg,semMin:sem.v,semI:sem.i,parcela:sim.valor>0?sim.valor/n:0,n};
}
const num=s=>{
  if(typeof s==='number')return isFinite(s)?s:0;
  s=String(s||'').replace(/R\$|\s/g,'');if(!s)return 0;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const v=parseFloat(s);return isFinite(v)?v:0;
};
const numS=s=>{s=String(s==null?'':s).trim();return s.startsWith('-')?-num(s.slice(1)):num(s);};

// ---- importação de extrato CSV
function splitCSV(line,d){const o=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(ch===d&&!q){o.push(cur);cur='';}else cur+=ch;}o.push(cur);return o.map(x=>x.trim());}
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function parseDateAny(s){s=String(s||'').trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');}return null;}
function parseCSV(text,opt){
  opt=opt||{};
  const lines=String(text||'').replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2)return{rows:[],ign:0,err:'vazio'};
  const d=[';','\t',','].reduce((b,x)=>lines[0].split(x).length>lines[0].split(b).length?x:b,';');
  const head=splitCSV(lines[0],d).map(norm);
  const iD=head.findIndex(h=>/^data|date/.test(h));
  const iDesc=head.findIndex((h,i)=>i!==iD&&/descri|hist|lancamento|estabelec|titulo|memo|detalhe/.test(h));
  const iV=head.findIndex(h=>/^valor|quantia|amount/.test(h)),iDeb=head.findIndex(h=>/debito|saida/.test(h)),iCre=head.findIndex(h=>/credito|entrada/.test(h));
  if(iD<0||(iV<0&&iDeb<0&&iCre<0))return{rows:[],ign:0,err:'colunas'};
  const rows=[];let ign=0;
  for(let k=1;k<lines.length;k++){
    const c=splitCSV(lines[k],d),data=parseDateAny(c[iD]);if(!data)continue;
    const desc=(iDesc>=0?c[iDesc]:'')||'';
    if(/fatura/.test(norm(desc))){ign++;continue;}
    let v;
    if(iV>=0)v=numS(String(c[iV]||'').replace(/\u2212/g,'-').replace(/R\$/,''));
    else v=num(c[iCre]||'')-num(c[iDeb]||'');
    if(!v)continue;
    if(opt.positiveSpend&&iV>=0)v=-v;
    rows.push({data,desc:desc.slice(0,60),valor:Math.round(Math.abs(v)*100)/100,tipo:v<0?'despesa':'receita'});
  }
  return{rows,ign};
}
// situação das parcelas de um parcelamento: confirmadas (pagas), assumidas (data já passou) e futuras
function parcInfo(p,now){
  const ds=parcelDates(p),pg=p.pagas||{};let paid=0,conf=0,falta=0,last=0;
  ds.forEach((n,k)=>{if(pg[k]){paid++;conf++;}else if(n<=now)paid++;else{falta+=p.valor;last=Math.max(last,n);}});
  return{ds,paid,conf,rest:ds.length-paid,falta,last:last||(ds[ds.length-1]||0)};
}

async function initStore(){
  const local=readLocal();
  try{store=await makeStore();}catch(e){store=null;}
  if(S.needLogin){S.ready=true;render();return;}
  if(!store){S.mode='local';applyData(local);S.ready=true;render();return;}
  S.mode='cloud';
  try{
    const raw=await store.loadAll();
    if(!raw.cfg&&local&&local.cfg&&local.cfg.setup){applyData(local);KINDS.forEach(k=>save(k));}
    else{
      const d=fromRaw(raw),dirty=getDirty();
      if(local)dirty.forEach(k=>{if(local[k]!==undefined)d[k]=local[k];});
      applyData(d);
      dirty.forEach(k=>save(k));
    }
    cacheLocal();
  }catch(e){S.mode='local';applyData(local);toast('Não consegui falar com a nuvem. Mostrando os dados deste aparelho.');}
  S.ready=true;render();
}

async function refresh(){

  if(KINDS.some(k=>S.pending[k]>0))return;
  if(getDirty().length){flushDirty();return;}

    const raw=await store.loadAll();
    if(!raw.cfg||KINDS.some(k=>S.pending[k]>0))return;
    const next=fromRaw(raw);next.cfg=normCfg(next.cfg);
    if(stable(next)===stable(snapshotData()))return;
    applyData(next);cacheLocal();
    if(idle())rerender();
  }catch(e){}
}

// Versão Vercel: Supabase (Postgres + login). A chave "anon" é pública por desenho; quem protege os dados é o RLS (veja supabase.sql).
let sb=null;
async function makeStore(){
  const c=window.CAIXA_CONFIG||{};
  // tolera espaços e o sufixo /rest/v1/ que o painel do Supabase mostra na página Data API
  const url=String(c.SUPABASE_URL||'').trim().replace(/\/rest\/v1\/?$/,'').replace(/\/+$/,''),key=String(c.SUPABASE_ANON_KEY||'').trim();
  if(!url||!key||url.includes('COLE_')||key.includes('COLE_')||!window.supabase){S.configMissing=true;return null;}
  if(!sb)sb=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  const {data}=await sb.auth.getSession();
  if(!data||!data.session){S.needLogin=true;return null;}
  const uid=data.session.user.id;
  return{
    async signOut(){try{await sb.auth.signOut();}catch(e){}try{localStorage.removeItem(LS_KEY);}catch(e){}location.reload();},
    async loadAll(){
      const {data,error}=await sb.from('caixa_docs').select('kind,data');
      if(error)throw error;
      const o={};KINDS.forEach(k=>{o[k]=null;});(data||[]).forEach(r=>{if(KINDS.includes(r.kind))o[r.kind]=r.data;});return o;
    },
    async write(k,p){
      const {error}=await sb.from('caixa_docs').upsert({user_id:uid,kind:k,data:p,updated_at:new Date().toISOString()},{onConflict:'user_id,kind'});
      if(error)throw error;
    }
  };
}

function spark(vals,w=320,h=76){
  if(vals.length<2)return'';
  const mn=Math.min(0,...vals),mx=Math.max(0,...vals),rg=(mx-mn)||1,pad=6;
  const X=i=>pad+i*(w-2*pad)/(vals.length-1),Y=v=>pad+(mx-v)*(h-2*pad)/rg;
  const pts=vals.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1));
  const zero=Y(0).toFixed(1);
  const neg=vals.findIndex(v=>v<0);
  return'<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Saldo previsto dos próximos dias">'+
    '<line x1="0" x2="'+w+'" y1="'+zero+'" y2="'+zero+'" stroke="var(--line)" stroke-dasharray="3 3"/>'+
    '<polygon points="'+X(0).toFixed(1)+','+zero+' '+pts.join(' ')+' '+X(vals.length-1).toFixed(1)+','+zero+'" fill="var(--accent)" opacity=".13"/>'+
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>'+
    (neg>=0?'<circle cx="'+X(neg).toFixed(1)+'" cy="'+Y(vals[neg]).toFixed(1)+'" r="4" fill="var(--neg)"/>':'')+'</svg>';
}
function bars(items,w=340,h=130){
  const mx=Math.max(1,...items.map(i=>i.v)),pad=18,bw=(w/items.length)*.62,step=w/items.length;
  let s='<svg class="chart" viewBox="0 0 '+w+' '+(h+18)+'" role="img" aria-label="Parcelas do cartão por mês">';
  items.forEach((it,i)=>{
    const bh=it.v>0?Math.max(3,(h-pad)*it.v/mx):0,x=i*step+(step-bw)/2,y=h-bh;
    s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="3" fill="'+(it.cur?'var(--accent)':'var(--accent)')+'" opacity="'+(it.cur?1:.55)+'"/>';
    if(it.v>0)s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle">'+Math.round(it.v)+'</text>';
    s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(h+13)+'" text-anchor="middle">'+esc(it.l)+'</text>';
  });
  return s+'<line x1="0" x2="'+w+'" y1="'+h+'" y2="'+h+'" stroke="var(--line)"/></svg>';
}
function twoLines(a,b,w=320,h=90){
  const all=a.concat(b),mn=Math.min(0,...all),mx=Math.max(0,...all),rg=(mx-mn)||1,pad=6;
  const X=i=>pad+i*(w-2*pad)/(a.length-1),Y=v=>pad+(mx-v)*(h-2*pad)/rg;
  const P=arr=>arr.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  return'<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Saldo com e sem a compra">'+
    '<line x1="0" x2="'+w+'" y1="'+Y(0).toFixed(1)+'" y2="'+Y(0).toFixed(1)+'" stroke="var(--line)" stroke-dasharray="3 3"/>'+
    '<polyline points="'+P(a)+'" fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="4 3"/>'+
    '<polyline points="'+P(b)+'" fill="none" stroke="'+(Math.min(...b)<0?'var(--neg)':'var(--accent)')+'" stroke-width="2.4" stroke-linejoin="round"/></svg>';
}

function fechSheet(dn){
  if(guardDemo())return;
  const iso=toISO(dn),sp=dailySpent(dn),ex=S.fech.find(f=>f.d===iso);
  const plan=ex&&ex.plan!=null?ex.plan:(S.cfg.gastoDiario||0);
  const isToday=dn===todayDn()&&dn>=C.start;
  const planV=Math.max(plan,sp);
  openSheet('<h2>Fechar '+(dn===todayDn()?'hoje':dShort(dn))+'</h2><p class="hint" style="margin:4px 0 0">Planejado: <b class="num">'+brl(plan)+'</b> · Já lançado (Diário, Alimentação, Transporte, Lazer): <b class="num">'+brl(sp)+'</b></p><form novalidate id="ff">'+
    '<label class="f" for="f-real">Quanto você gastou de verdade no dia?</label><input type="text" id="f-real" inputmode="decimal" required value="'+esc(String(ex?ex.real:sp).replace('.',','))+'">'+
    '<div class="chips"><button type="button" class="btn" data-v="'+sp+'">Só o lançado</button><button type="button" class="btn" data-v="'+planV+'">O planejado</button>'+(sp===0?'<button type="button" class="btn" data-v="0">Nada</button>':'')+'</div>'+
    '<div id="fres"></div>'+
    (isToday?'<label class="f" for="f-banco">Conferir com o banco (opcional): saldo na conta agora</label><input type="text" id="f-banco" inputmode="decimal" placeholder="Ex.: 1.234,56"><div id="fbres"></div>':'')+
    '<div class="btns"><button class="btn primary" type="submit">Fechar o dia</button><button class="btn ghost" type="button" data-act="closesheet">Cancelar</button></div></form>',sh=>{
      let corr=false;
      const real=()=>num($('#f-real',sh).value);
      const expected=r=>{const day=C.days[dn-C.start];return day.saldo-(Math.max(0,r-sp)-day.gd);};
      const upd=()=>{
        const r=real(),d=plan-r;
        $('#fres',sh).innerHTML=plan>0?(r<=plan+0.005?'<div class="alert ok">Dentro do plano'+(d>0.005?': sobram '+brl(d)+'.':'.')+'</div>':'<div class="alert">Estourou '+brl(-d)+'. Isso sai do saldo previsto.</div>'):'';
        if(!isToday)return;
        const raw=$('#f-banco',sh).value.trim(),box=$('#fbres',sh);
        if(!raw){box.innerHTML='';corr=false;return;}
        const bv=numS(raw),ex_=expected(r),diff=bv-ex_;
        box.innerHTML=Math.abs(diff)<0.5?'<div class="alert ok">O app previa '+brl(ex_)+' no fim do dia. Bate certinho.</div>':
          '<div class="alert warn">O app previa '+brl(ex_)+' no fim do dia e o banco mostra '+brl(bv)+'. Diferença de '+(diff>0?'+':'-')+brl(Math.abs(diff))+': '+(diff<0?'algum gasto não foi lançado.':'entrou algo que não está no app.')+
          '<button type="button" class="btn block" data-corr aria-pressed="'+corr+'">'+(corr?'Vou corrigir o saldo do app':'Corrigir o saldo do app para '+brl(bv))+'</button></div>';
      };
      sh.addEventListener('input',upd);
      sh.addEventListener('click',e=>{
        const chip=e.target.closest('[data-v]');if(chip){$('#f-real',sh).value=String(Number(chip.dataset.v)).replace('.',',');upd();return;}
        if(e.target.closest('[data-corr]')){corr=!corr;upd();}
      });
      upd();
      $('#ff',sh).onsubmit=e=>{e.preventDefault();
        const r=real();
        if(r<sp-0.005){toast('Você já lançou '+brl(sp)+' neste dia. O total não pode ser menor.');return;}
        S.fech=S.fech.filter(f=>f.d!==iso).concat({d:iso,real:Math.round(r*100)/100,plan,ts:Date.now()});
        save('fech');
        if(isToday&&corr){const raw=$('#f-banco',sh).value.trim();if(raw){S.cfg.saldo=numS(raw);S.cfg.saldoData=toISO(dn+1);S.cfg.saldoTs=0;save('cfg');}}
        closeSheet();rerender();
        toast(plan>0&&r>plan+0.005?'Dia fechado. Estourou '+brl(r-plan)+'.':'Dia fechado. Dentro do plano.');
      };
    });
}

function reservaGuardada(){
  const m=S.cfg.meta||{},d0=parseISO(m.data);let tot=m.atual||0;
  if(d0!=null&&S.cfg.reserva>0)monthly(d0+1,todayDn(),S.cfg.diaSalario,()=>{tot+=S.cfg.reserva;});
  S.lanc.forEach(l=>{
    const n=parseISO(l.data);if(n==null||d0==null)return;
    if(n<d0||(n===d0&&l.ts&&m.ts&&l.ts<=m.ts))return;
    if(l.fonte==='reserva'&&l.tipo!=='receita')tot-=l.valor;
    else if(l.cat==='Reserva')tot+=l.tipo==='despesa'?l.valor:-l.valor;
  });
  return tot;
}
function reservaInfo(){
  const m=S.cfg.meta||{},alvo=m.alvo||0;if(!(alvo>0))return null;
  const g=reservaGuardada(),falta=Math.max(0,alvo-g),mensal=S.cfg.reserva||0;
  return{alvo,g,falta,mensal,months:falta<=0?0:(mensal>0?Math.ceil(falta/mensal):null)};
}
const mesAdiante=n=>{const t=ymd(todayDn()),mm=t.m+n;return MONF[((mm%12)+12)%12]+' de '+(t.y+Math.floor(mm/12));};
function custoMensal(){const ms=C.months.slice(1,7);if(!ms.length)return 0;return ms.reduce((a,m)=>a+m.saidas-m.res,0)/ms.length;}
function reservaBtns(){return'<div class="chips" style="margin-top:12px"><button class="btn" data-act="resv" data-tipo="dep">Guardar</button><button class="btn" data-act="resv" data-tipo="ret">Retirar</button><button class="btn" data-act="resvgasto">Gasto pago com a reserva</button></div>';}

  else h+='<p class="hint" style="margin:10px 0 0">Defina um valor de reserva mensal em Ajustes para ver a previsão.</p>';
  return h+reservaBtns()+'</div>';
}

/* ---------- análise (BI) ---------- */
const ORG_COL={'Cartão':'var(--warn)','Contas fixas':'var(--accent)','Faculdade':'var(--muted)','Débito/Pix':'var(--pos)','Dia a dia (previsto)':'var(--line)','Reserva de emergência':'var(--neg)'};
const DISC=['Lazer','Alimentação','Compras','Assinaturas','Diário','Dia a dia (previsto)','Outros'];
const sum=o=>Object.values(o||{}).reduce((a,b)=>a+b,0);
const sortE=o=>Object.entries(o||{}).sort((a,b)=>b[1]-a[1]);
function barList(entries,total){
  const mx=Math.max(1,...entries.map(e=>e[1]));
  return'<ul class="list">'+entries.map(([n,v])=>'<li class="row" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px"><div class="t">'+esc(n)+'</div><div class="amt num">'+brl(v,false)+' <span class="m" style="font-weight:500">'+Math.round(100*v/(total||1))+'%</span></div></div><div class="bar"><i style="width:'+Math.max(2,Math.round(100*v/mx))+'%"></i></div></li>').join('')+'</ul>';
}
function insights(m,i){
  const out=[],renda=S.cfg.renda||0,cats=m.cats||{},total=sum(cats),E=sortE(cats),gm=n=>cats[n]||0,RI=reservaInfo();
  const mesName=MONF[m.m];
  if(E.length&&total>0)out.push({t:'Maior fatia: '+E[0][0],x:E[0][0]+' leva '+Math.round(100*E[0][1]/total)+'% do que sai em '+mesName+' ('+brl(E[0][1],false)+').'});
  const card=(m.orgs||{})['Cartão']||0;
  if(renda>0&&card>0){
    const pc=Math.round(100*card/renda),zi=C.months.findIndex((x,k)=>k>i&&x.parc===0);
    out.push({tone:pc>=30?'bad':pc>=20?'warn':'',t:'Parcelas do cartão: '+pc+'% da renda',x:'São '+brl(card,false)+' por mês.'+(pc>=30?' Acima de 30% costuma apertar o orçamento: evite novas compras parceladas. ':' ')+(zi>0?'Em '+MONF[C.months[zi].m]+' de '+C.months[zi].y+' elas acabam e liberam '+brl(card,false)+' por mês.':'')});
  }
  const dp=(m.orgs||{})['Dia a dia (previsto)']||0;
  if(total>0&&dp>total*0.3)out.push({tone:'warn',t:'Boa parte do gasto está só prevista',x:'Cerca de '+Math.round(100*dp/total)+'% é o gasto diário estimado. Lance os gastos reais e feche o dia para ver para onde o dinheiro vai de verdade.'});
  if(gm('Assinaturas')>0)out.push({t:'Assinaturas: '+brl(gm('Assinaturas'),false)+' por mês',x:'Dá '+brl(gm('Assinaturas')*12,false)+' por ano. Vale cancelar as que você quase não usa.'});
  DISC.map(n=>[n,gm(n)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,2).forEach(([n,v])=>{
    const cut=v*0.15;let ex='';
    if(RI&&RI.falta>0&&RI.mensal>0){const a=RI.months,b=Math.ceil(RI.falta/(RI.mensal+cut));if(a-b>=1)ex=' Guardando essa economia, a reserva fica pronta '+(a-b)+' mes'+(a-b>1?'es':'')+' mais cedo.';}
    out.push({t:'Cortar 15% em '+n+' libera '+brl(cut,false)+' por mês',x:'Em 12 meses são '+brl(cut*12,false)+'.'+ex});
  });
  const fe=S.fech.slice().sort((a,b)=>a.d<b.d?1:-1).slice(0,14),plan=S.cfg.gastoDiario||0;
  if(fe.length>=5&&plan>0){const avg=fe.reduce((a,f)=>a+f.real,0)/fe.length;if(avg>plan*1.1)out.push({tone:'warn',t:'Gasto real acima do plano',x:'Nos últimos '+fe.length+' fechamentos a média foi '+brl(avg,false)+' por dia, contra '+brl(plan,false)+'. Cada R$ 10 a menos por dia libera R$ 300 por mês.'});}
  if(renda>0&&(S.cfg.reserva||0)/renda<0.1)out.push({tone:'warn',t:'Você guarda '+Math.round(100*(S.cfg.reserva||0)/renda)+'% da renda',x:'Uma meta comum é guardar entre 10% e 20%. Os cortes acima ajudam a chegar lá.'});
  return out.slice(0,7);
}
function viewAnalise(){
  const ms=C.months.slice(0,12),i=clamp(S.biMonth||0,0,ms.length-1),m=ms[i],now=todayDn();
  const cats=sortE(m.cats),total=sum(m.cats);
  let h='';
  if(S.demo)h+='<div class="demo"><span>Exemplo: nada aqui é seu nem é salvo.</span><button data-act="startreal">Usar com meus dados</button></div>';
  h+='<div class="sec-title"><h2>Análise</h2><span></span></div><label class="f" for="bi-mes" style="margin-top:0">Mês</label><select id="bi-mes">'+ms.map((x,k)=>'<option value="'+k+'"'+(k===i?' selected':'')+'>'+MONF[x.m]+' '+x.y+(k===0&&ymd(C.start).d>1?' (a partir do dia '+ymd(C.start).d+')':'')+'</option>').join('')+'</select>';
  // 1. para onde vai
  h+='<div class="card"><div class="lbl">Para onde vai o dinheiro</div><div class="big num" style="font-size:34px">'+brl(total,false)+'</div><p class="hint" style="margin:0 0 6px">total que sai em '+MONF[m.m]+', sem contar a reserva mensal.</p>';
  if(!cats.length)h+='<div class="empty">Sem dados para este mês.</div>';
  else{const top=cats.slice(0,8),rest=cats.slice(8).reduce((a,e)=>a+e[1],0);if(rest>0)top.push(['Outras',rest]);h+=barList(top,total);}
  h+='</div>';
  // 2. como paga
  const orgs=sortE(m.orgs),ot=sum(m.orgs);
  if(orgs.length){h+='<div class="card"><div class="lbl">Como você paga</div><div class="stack" role="img" aria-label="Divisão por forma de pagamento">'+orgs.map(([n,v])=>'<i style="width:'+(100*v/ot).toFixed(1)+'%;background:'+(ORG_COL[n]||'var(--accent)')+'"></i>').join('')+'</div>'+
    orgs.map(([n,v])=>'<div class="legend"><i style="background:'+(ORG_COL[n]||'var(--accent)')+';border:1px solid var(--line)"></i><span style="flex:1">'+esc(n)+'</span><b class="num">'+brl(v,false)+'</b><span class="m" style="width:38px;text-align:right">'+Math.round(100*v/ot)+'%</span></div>').join('')+'</div>';}
  // 3. cartão por categoria
  const ck=sortE(m.card),ct=sum(m.card);
  h+='<div class="card"><div class="lbl">Cartão de crédito por categoria</div>';
  if(!ck.length)h+='<p class="hint" style="margin:6px 0 0">Nenhuma compra no cartão neste mês. Classifique as parcelas na aba Cartão e lance as compras no crédito em Lançar (Pago com: Cartão de crédito) para ver onde o cartão está indo.</p>';
  else h+='<p class="hint" style="margin:2px 0 6px">'+brl(ct,false)+' no cartão (parcelas e compras)'+(S.cfg.renda>0?' ('+Math.round(100*ct/S.cfg.renda)+'% da renda)':'')+'.</p>'+barList(ck,ct);
  h+='</div>';
  const cw=sortE(m.cards);
  if(cw.length>1||(cw.length===1&&cw[0][0]!=='Sem cartão informado')){h+='<div class="card"><div class="lbl">Por cartão</div>'+barList(cw,sum(m.cards))+'</div>';}
  // 4. verde

  h+='<div class="card"><div class="lbl">Quanto tempo no verde</div>'+
    (neg>=0?'<div class="big num neg" style="font-size:30px">'+(C.days[neg].dn-now)+' dias</div><p class="hint" style="margin:0">até o saldo ficar negativo ('+dShort(C.days[neg].dn)+'), se nada mudar.</p>':'<div class="big num" style="font-size:30px;color:var(--pos)">12 meses</div><p class="hint" style="margin:0">de saldo positivo, do jeito que está planejado.</p>')+
    '<div class="grid2" style="margin-top:12px"><div><div class="lbl">Sobra média/mês</div><div class="num" style="font-weight:700;font-size:18px" class="'+(avg<0?'neg':'')+'">'+brl(avg,false)+'</div><div class="m hint">depois da reserva</div></div><div><div class="lbl">Meses com sobra</div><div class="num" style="font-weight:700;font-size:18px">'+pos+' de '+full.length+'</div><div class="m hint">menor saldo: '+brl(mn.v,false)+'</div></div></div></div>';
  // 5. reserva
  const RI=reservaInfo();
  h+='<div class="card"><div class="lbl">Tempo para a reserva de emergência</div>';
  if(!RI)h+='<p class="hint" style="margin:6px 0 0">Defina um alvo em Ajustes (ou na aba Meses) para ver quanto tempo falta.</p>';
  else if(RI.falta<=0)h+='<p class="hint" style="margin:6px 0 0">Alvo de '+brl(RI.alvo,false)+' atingido.</p>';
  else{
    h+='<div class="big num" style="font-size:30px">'+(RI.months==null?'sem previsão':RI.months+' meses')+'</div><p class="hint" style="margin:0">'+(RI.months==null?'Defina a reserva mensal em Ajustes.':'para juntar mais '+brl(RI.falta,false)+', guardando '+brl(RI.mensal,false)+' por mês ('+mesAdiante(RI.months)+').')+'</p>';
    h+='<ul class="list" style="margin-top:8px">'+[100,200,500].map(x=>{const n=Math.ceil(RI.falta/(RI.mensal+x));return'<li class="row"><div class="main"><div class="t">Guardando +'+brl(x,false)+' por mês</div><div class="m">'+mesAdiante(n)+'</div></div><div class="amt num">'+n+' meses</div></li>';}).join('')+
      '<li class="row"><div class="main"><div class="t">Para chegar em 12 meses</div><div class="m">precisa guardar</div></div><div class="amt num">'+brl(RI.falta/12,false)+'/mês</div></li></ul>';
  }
  h+='</div>';
  // 6. insights
  const ins=insights(m,i);
  h+='<div class="sec-title"><h2>Onde dá para melhorar</h2></div><div class="card">'+(ins.length?ins.map(x=>'<div class="ins '+(x.tone||'')+'"><b>'+esc(x.t)+'</b><span>'+esc(x.x)+'</span></div>').join(''):'<div class="empty">Cadastre renda, contas fixas e parcelas para ver sugestões.</div>')+'</div>';
  return h;
}

function csvSheet(text){
  if(guardDemo())return;
  const st={pos:false,inc:false,cat:'Diário'};
  const calcRows=()=>{
    const r=parseCSV(text,{positiveSpend:st.pos});
    const key=(d,v,t)=>d+'|'+Number(v).toFixed(2)+'|'+String(t||'').toLowerCase();
    const have=new Set(S.lanc.map(l=>key(l.data,l.valor,l.desc)));
    const rows=r.rows.filter(x=>st.inc||x.tipo==='despesa');
    const fresh=rows.filter(x=>!have.has(key(x.data,x.valor,x.desc)));
    return{r,rows,fresh,dup:rows.length-fresh.length};
  };
  const first=calcRows();
  if(first.r.err){toast(first.r.err==='colunas'?'Não achei as colunas de data e valor no arquivo.':'Arquivo vazio.');return;}
  const body=()=>{
    const c=calcRows();
    return'<h2>Importar extrato</h2><p class="hint" style="margin:4px 0 0">'+c.r.rows.length+' linhas lidas · <b>'+c.fresh.length+' novas</b>'+(c.dup?' · '+c.dup+' já lançadas':'')+(c.r.ign?' · '+c.r.ign+' de fatura ignoradas':'')+'</p>'+
    '<div class="card" style="padding-block:4px;margin-block:10px"><ul class="list">'+(c.fresh.slice(0,6).map(x=>'<li class="row"><div class="main"><div class="t">'+esc(x.desc||'(sem descrição)')+'</div><div class="m">'+dFull(parseISO(x.data))+'</div></div><div class="amt num '+(x.tipo==='receita'?'pos':'')+'">'+(x.tipo==='receita'?'+':'-')+brl(x.valor)+'</div></li>').join('')||'<li class="empty">Nada novo para importar.</li>')+'</ul>'+(c.fresh.length>6?'<div class="m" style="padding:4px 0">e mais '+(c.fresh.length-6)+'...</div>':'')+'</div>'+
    '<label class="f" for="i-pos">Neste arquivo, os gastos aparecem como</label><select id="i-pos"><option value="0"'+(st.pos?'':' selected')+'>Valores negativos (-35,90)</option><option value="1"'+(st.pos?' selected':'')+'>Valores positivos (35,90)</option></select>'+
    '<label class="f" for="i-inc">O que importar</label><select id="i-inc"><option value="0"'+(st.inc?'':' selected')+'>Só gastos (recomendado)</option><option value="1"'+(st.inc?' selected':'')+'>Gastos e entradas</option></select>'+
    '<label class="f" for="i-cat">Categoria dos gastos</label><select id="i-cat">'+CATS_OUT.map(k=>'<option'+(st.cat===k?' selected':'')+'>'+k+'</option>').join('')+'</select>'+
    '<p class="hint" style="margin:10px 0 0">Salário e parcelas já entram sozinhos; por isso o padrão é só gastos e linhas de fatura são ignoradas. Linhas anteriores à data do seu saldo ficam fora da conta.</p>'+
    '<div class="btns"><button class="btn primary" data-ok'+(c.fresh.length?'':' disabled')+'>Importar '+c.fresh.length+' lançamentos</button><button class="btn ghost" data-act="closesheet">Cancelar</button></div>';
  };
  openSheet(body(),sh=>{
    const wire=()=>{
      const re=()=>{sh.innerHTML=body();wire();};
      $('#i-pos',sh).onchange=e=>{st.pos=e.target.value==='1';re();};
      $('#i-inc',sh).onchange=e=>{st.inc=e.target.value==='1';re();};
      $('#i-cat',sh).onchange=e=>{st.cat=e.target.value;re();};
      sh.querySelector('[data-ok]').onclick=()=>{
        const c=calcRows(),ts=S.cfg.saldoTs||0;
        c.fresh.forEach(x=>S.lanc.push({id:uid_(),data:x.data,tipo:x.tipo,valor:x.valor,cat:x.tipo==='receita'?'Outros':st.cat,desc:x.desc,ts}));
        save('lanc');closeSheet();rerender();toast(c.fresh.length+' lançamentos importados.');
      };
    };wire();
  });
}

    '<div class="chips"><button type="button" class="btn" data-n="1">1</button><button type="button" class="btn" data-n="'+R+'">Quitar tudo ('+R+')</button></div>'+
    '<div class="two"><div><label class="f" for="a-d">Data do pagamento</label><input type="date" id="a-d" value="'+toISO(now)+'"></div><div><label class="f" for="a-v">Valor total pago</label><input type="text" id="a-v" inputmode="decimal" value="'+String(Math.round(R*p.valor*100)/100).replace('.',',')+'"></div></div>'+
    '<div id="a-res"></div><p class="hint" style="margin:10px 0 0">Se o banco deu desconto, informe o valor realmente pago. O valor sai da conta na data informada.</p>'+
    '<div class="btns"><button class="btn primary" type="submit">Antecipar</button><button class="btn ghost" type="button" data-act="closesheet">Cancelar</button></div></form>',sh=>{
      const nIn=$('#a-n',sh),vIn=$('#a-v',sh);
      const cnt=()=>Math.max(1,Math.min(R,parseInt(nIn.value)||1));
      const upd=()=>{const n=cnt(),full=Math.round(n*p.valor*100)/100,tot=num(vIn.value),diff=full-tot;
        $('#a-res',sh).innerHTML='<div class="alert '+(diff>0.005?'ok':'warn')+'">'+n+' parcela'+(n>1?'s':'')+' de '+brl(p.valor)+' = '+brl(full)+(diff>0.005?'. Desconto de '+brl(diff)+'.':(diff<-0.005?'. Você pagou '+brl(-diff)+' a mais.':'.'))+'</div>';};
      nIn.addEventListener('input',()=>{if(!edited)vIn.value=String(Math.round(cnt()*p.valor*100)/100).replace('.',',');upd();});
      vIn.addEventListener('input',()=>{edited=true;upd();});
      sh.addEventListener('click',e=>{const c=e.target.closest('[data-n]');if(c){nIn.value=c.dataset.n;nIn.dispatchEvent(new Event('input'));}});
      upd();
      $('#af',sh).onsubmit=e=>{e.preventDefault();
        const n=cnt(),tot=num(vIn.value),d=$('#a-d',sh).value;
        if(!(tot>0)){toast('Informe o valor pago.');return;}
        if(!parseISO(d)){toast('Informe a data do pagamento.');return;}
        const sel=ks.slice(-n),per=Math.floor(tot/n*100)/100;
        p.pagas=p.pagas||{};
        sel.forEach((k,i)=>{p.pagas[k]={d,v:i===sel.length-1?Math.round((tot-per*(n-1))*100)/100:per};});
        save('parcelas');closeSheet();rerender();
        const eco=Math.round((n*p.valor-tot)*100)/100;
        toast(n+' parcela'+(n>1?'s antecipadas':' antecipada')+(eco>0.005?'. Economia de '+brl(eco)+'.':'.'));
      };
    });
}

function parcSheet(id){
  if(guardDemo())return;
  const ex=id?S.parcelas.find(p=>p.id===id):null;
  openSheet('<h2>'+(ex?'Editar parcelamento':'Novo parcelamento')+'</h2><form novalidate id="pf">'+
    '<label class="f" for="p-nome" style="margin-top:14px">O que foi comprado</label><input type="text" id="p-nome" required placeholder="Ex.: celular" value="'+esc(ex?ex.nome:'')+'">'+
    '<label class="f" for="p-cartao">Cartão (opcional)</label>'+cardSel('p-cartao',ex?ex.cartao:'',true)+
    '<label class="f" for="p-cat">Categoria da compra</label><select id="p-cat">'+catOpts(ex?(ex.cat||guessCat(ex.nome,true)):'Compras')+'</select>'+
    '<div class="two"><div><label class="f" for="p-data">Data da 1ª parcela</label><input type="date" id="p-data" required value="'+esc(ex?ex.primeira:'')+'"></div><div><label class="f" for="p-n">Nº de parcelas</label><input type="number" id="p-n" min="1" max="72" required value="'+(ex?ex.n:'')+'"></div></div>'+
    '<div class="two"><div><label class="f" for="p-valor">Valor da parcela</label><input type="text" id="p-valor" inputmode="decimal" placeholder="0,00" value="'+(ex?esc(String(ex.valor).replace('.',',')):'')+'"></div><div><label class="f" for="p-total">Ou o total da compra</label><input type="text" id="p-total" inputmode="decimal" placeholder="0,00"></div></div>'+
    '<p class="hint" style="margin:10px 0 0">Data da 1ª parcela: o dia em que ela sai da conta (vencimento da fatura). Para parcelamentos antigos, use a data da 1ª parcela mesmo que seja no passado. Informe a parcela ou o total.</p>'+
    '<div class="btns"><button class="btn primary" type="submit">Salvar</button>'+(ex?'<button class="btn danger" type="button" data-del>Excluir</button>':'')+'<button class="btn ghost" type="button" data-act="closesheet">Cancelar</button></div></form>',sh=>{
      const vi=$('#p-valor',sh),ti=$('#p-total',sh),ni=$('#p-n',sh);cardWire(sh,'p-cartao');
      if(!ex){let touched=false;$('#p-cat',sh).onchange=()=>{touched=true;};$('#p-nome',sh).addEventListener('input',e=>{if(!touched)$('#p-cat',sh).value=guessCat(e.target.value,true);});}
      ti.oninput=()=>{const n=Math.max(1,parseInt(ni.value)||1);const t=num(ti.value);if(t>0)vi.value=(Math.round(t/n*100)/100).toFixed(2).replace('.',',');};
      $('#pf',sh).onsubmit=e=>{e.preventDefault();
        const n=parseInt(ni.value);let v=num(vi.value);const t=num(ti.value);if(!(v>0)&&t>0&&n>0)v=Math.round(t/n*100)/100;
        if(!(v>0)){toast('Informe o valor da parcela ou o total.');return;}
        if(!(n>=1)){toast('Informe o número de parcelas.');return;}
        const rec={id:ex?ex.id:uid_(),nome:$('#p-nome',sh).value.trim(),cartao:cardRead(sh,'p-cartao'),cat:$('#p-cat',sh).value,primeira:$('#p-data',sh).value,n,valor:v};
        if(ex&&ex.pagas)rec.pagas=ex.pagas;
        if(!parseISO(rec.primeira)){toast('Informe a data da 1ª parcela.');return;}
        if(ex)S.parcelas=S.parcelas.map(p=>p.id===ex.id?rec:p);else S.parcelas.push(rec);
        save('parcelas');closeSheet();rerender();toast('Parcelamento salvo.');};
      const del=sh.querySelector('[data-del]');
      if(del)del.onclick=()=>{if(del.dataset.sure){S.parcelas=S.parcelas.filter(p=>p.id!==ex.id);save('parcelas');closeSheet();rerender();toast('Excluído.');}else{del.dataset.sure='1';del.textContent='Toque de novo para excluir';}};
    });
}
function fixSheet(grp){
  if(guardDemo())return;
  const fx=grp==='fixas';
  openSheet('<h2>'+(fx?'Nova despesa fixa':'Nova entrada recorrente')+'</h2><p class="hint" style="margin:4px 0 0">'+(fx?'Algo que sai da conta todo mês, como aluguel, luz ou internet.':'Algo que entra na conta todo mês, além do salário.')+'</p><form novalidate id="xf">'+
    '<label class="f" for="x-nome">Nome</label><input type="text" id="x-nome" placeholder="'+(fx?'Ex.: aluguel':'Ex.: freela fixo')+'">'+(fx?'<label class="f" for="x-cat">Categoria</label><select id="x-cat">'+catOpts('Contas')+'</select>':'')+
    '<div class="two"><div><label class="f" for="x-dia">Dia do mês (1 a 31)</label><input type="text" id="x-dia" inputmode="numeric" placeholder="Ex.: 10"></div><div><label class="f" for="x-valor">Valor</label><input type="text" id="x-valor" inputmode="decimal" placeholder="0,00"></div></div>'+
    '<div class="btns"><button class="btn primary" type="submit">Adicionar</button><button class="btn ghost" type="button" data-act="closesheet">Cancelar</button></div></form>',sh=>{
      if(fx){let touched=false;$('#x-cat',sh).onchange=()=>{touched=true;};$('#x-nome',sh).addEventListener('input',e=>{if(!touched)$('#x-cat',sh).value=guessCat(e.target.value);});}
      $('#xf',sh).onsubmit=e=>{e.preventDefault();
        const dia=parseInt($('#x-dia',sh).value),valor=num($('#x-valor',sh).value);
        if(!(dia>=1&&dia<=31)){toast('Informe o dia do mês, de 1 a 31.');return;}
        if(!(valor>0)){toast('Informe o valor.');return;}
        S.cfg[grp].push(fx?{id:uid_(),nome:$('#x-nome',sh).value.trim(),dia,valor,cat:$('#x-cat',sh).value}:{id:uid_(),nome:$('#x-nome',sh).value.trim(),dia,valor});
        save('cfg');closeSheet();rerender();toast(fx?'Despesa fixa adicionada.':'Entrada recorrente adicionada.');
      };
    });
}
function saldoSheet(){
  if(guardDemo())return;
  openSheet('<h2>Atualizar saldo</h2><p class="hint" style="margin:4px 0 0">Informe quanto você tem na conta agora (sem contar o cartão). O app recalcula tudo a partir de hoje. O que você já lançou hoje fica de fora, porque já está dentro desse saldo.</p><form novalidate id="sf">'+
    '<label class="f" for="s-valor">Saldo na conta agora</label><input type="text" id="s-valor" inputmode="decimal" required value="'+esc(String(S.cfg.saldo).replace('.',','))+'">'+
    '<div class="btns"><button class="btn primary" type="submit">Atualizar</button><button class="btn ghost" type="button" data-act="closesheet">Cancelar</button></div></form>',sh=>{
      $('#sf',sh).onsubmit=e=>{e.preventDefault();
        S.cfg.saldo=numS($('#s-valor',sh).value);S.cfg.saldoData=toISO(todayDn());S.cfg.saldoTs=Date.now();
        save('cfg');closeSheet();rerender();toast('Saldo atualizado.');};
    });
}
async function exportData(){
  if(guardDemo())return;
  const text=JSON.stringify(Object.assign({app:'caixa-do-dia',v:2,exportado:new Date().toISOString()},snapshotData()),null,2);
  const name='caixa-do-dia-'+toISO(todayDn())+'.json';
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data:text});return;}
  }catch(e){return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Backup baixado.');
}
function importSheet(d){
  openSheet('<h2>Restaurar backup</h2><p class="hint" style="margin:4px 0 0">Isto substitui todos os dados atuais por '+((d.parcelas||[]).length)+' parcelamentos, '+((d.lanc||[]).length)+' lançamentos e '+((d.fech||[]).length)+' fechamentos do arquivo.</p><div class="btns"><button class="btn danger" data-ok>Substituir meus dados</button><button class="btn ghost" data-act="closesheet">Cancelar</button></div>',sh=>{
    sh.querySelector('[data-ok]').onclick=()=>{applyData(d);KINDS.forEach(k=>save(k));closeSheet();S.tab='hoje';render();toast('Backup restaurado.');};
  });
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='tab'){S.tab=el.dataset.tab;render();}
  else if(a==='closesheet'){if(e.target===el||el.tagName==='BUTTON')closeSheet();}
  else if(a==='addlanc')lancSheet(null,el.dataset.tipo);
  else if(a==='editlanc')lancSheet(el.dataset.id);
  else if(a==='editresv')reservaSheet(null,el.dataset.id);
  else if(a==='resv')reservaSheet(el.dataset.tipo);
  else if(a==='resvgasto')lancSheet(null,'despesa','reserva');
  else if(a==='addparc')parcSheet();
  else if(a==='editparc')parcSheet(el.dataset.id);
  else if(a==='parcdet')parcDetail(el.dataset.id);
  else if(a==='parcpay'){if(guardDemo())return;parcSetPaid(el.dataset.id,Number(el.dataset.k),!!el.dataset.keep);}
  else if(a==='parcundo'){if(guardDemo())return;const p=S.parcelas.find(x=>x.id===el.dataset.id);if(p&&p.pagas){delete p.pagas[Number(el.dataset.k)];if(!Object.keys(p.pagas).length)delete p.pagas;save('parcelas');rerender();toast('Pagamento desfeito.');parcDetail(p.id);}}
  else if(a==='ante')anteSheet(el.dataset.id);
  else if(a==='saldo')saldoSheet();
  else if(a==='fechar')fechSheet(Number(el.dataset.dn));
  else if(a==='adjgd'){if(guardDemo())return;S.cfg.gastoDiario=Number(el.dataset.v);save('cfg');rerender();toast('Gasto diário ajustado.');}
  else if(a==='export')exportData();
  else if(a==='import'){if(guardDemo())return;$('#imp').click();}
  else if(a==='signout'){if(store&&store.signOut)store.signOut();}
  else if(a==='openmonth'){const k=Number(el.dataset.key);S.openMonth=S.openMonth===k?null:k;rerender();}
  else if(a==='addfix'||a==='addrec')fixSheet(a==='addfix'?'fixas':'recorrentes');
  else if(a==='usealvo'){if(guardDemo())return;S.cfg.meta.alvo=Number(el.dataset.v);if(!S.cfg.meta.data)S.cfg.meta.data=toISO(todayDn());save('cfg');rerender();toast('Alvo definido.');}
  else if(a==='importcsv'){if(guardDemo())return;$('#csv').click();}
  else if(a==='delfix'){if(guardDemo())return;if(el.dataset.sure){const g=el.dataset.grp||'fixas';S.cfg[g]=S.cfg[g].filter(f=>f.id!==el.dataset.id);save('cfg');rerender();}else{el.dataset.sure='1';el.textContent='Excluir?';el.classList.add('sure');}}
  else if(a==='demo'){const d=demoData();S.demo=true;S.cfg=normCfg(d.cfg);S.parcelas=d.parcelas;S.lanc=d.lanc;S.fech=d.fech;S.tab='hoje';render();}
  else if(a==='startreal'){S.demo=false;S.ready=false;$('#view').innerHTML='<div class="skel"></div>';initStore();}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='ob'){
    e.preventDefault();
    const renda=num($('#o-renda').value),dia=clamp(parseInt($('#o-dia').value)||5,1,31),saldo=num($('#o-saldo').value),gd=num($('#o-gd').value);
    if(!(renda>0)){toast('Informe sua renda líquida mensal.');return;}
    Object.assign(S.cfg,{setup:true,renda,diaSalario:dia,saldo,saldoData:toISO(todayDn()),saldoTs:Date.now(),gastoDiario:gd,folga:S.cfg.folga||100});
    save('cfg');S.tab='hoje';render();toast('Pronto! Agora cadastre suas contas fixas em Ajustes.');
  }
});
/* Em páginas dentro de iframe com sandbox (como o Artifact) o navegador bloqueia o envio nativo de formulários e nem dispara o evento "submit".
   Por isso o envio é feito manualmente: clique no botão ou Enter disparam o evento "submit" por código. */
const fireSubmit=f=>f.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
document.addEventListener('click',e=>{const b=e.target.closest('button[type=submit]');if(!b||!b.form||b.disabled)return;e.preventDefault();fireSubmit(b.form);},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.form&&!/^(submit|button|file|checkbox|radio)$/.test(e.target.type)){e.preventDefault();fireSubmit(e.target.form);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='sim-valor'||id==='sim-n'||id==='sim-data'||id==='sim-dataav'){
    S.sim.valor=$('#sim-valor').value;S.sim.n=$('#sim-n').value;S.sim.data=$('#sim-data').value;S.sim.dataAv=$('#sim-dataav').value;
    $('#simres').innerHTML=simResult();
    const dv=parseISO(S.sim.dataAv)??todayDn();$('#maxav').textContent=brl(maxAvista(C,dv-C.start,S.cfg.folga));
  }
});
document.addEventListener('change',e=>{
  const t=e.target,id=t.id;if(!id&&!t.dataset.f)return;
  if(id==='bi-mes'){S.biMonth=Number(t.value);rerender();return;}
  if(id==='csv'){const f=t.files&&t.files[0];t.value='';if(!f)return;f.text().then(x=>csvSheet(x));return;}
  if(id==='imp'){const f=t.files&&t.files[0];t.value='';if(!f)return;f.text().then(x=>{let d=null;try{d=JSON.parse(x);}catch(err){}if(!d||!d.cfg||typeof d.cfg!=='object'||d.app!=='caixa-do-dia'){toast('Esse arquivo não parece um backup do Caixa do Dia.');return;}importSheet(d);});return;}
  if(S.demo&&(id.startsWith('c-')||id.startsWith('f-')||id.startsWith('b-')||id.startsWith('m-')||t.dataset.f)){guardDemo();return;}
  const c=S.cfg;let ch=true;
  if(id==='c-renda')c.renda=num(t.value);
  else if(id==='c-dia')c.diaSalario=clamp(parseInt(t.value)||1,1,31);
  else if(id==='c-reserva')c.reserva=num(t.value);
  else if(id==='c-gd')c.gastoDiario=num(t.value);
  else if(id==='c-folga')c.folga=num(t.value);
  else if(id.startsWith('b-')){const cat=CATS_OUT[Number(id.slice(2))];if(cat){if(num(t.value)>0)c.orc[cat]=num(t.value);else delete c.orc[cat];}else ch=false;}
  else if(id==='m-alvo')c.meta.alvo=num(t.value);
  else if(id==='m-atual'){c.meta.atual=num(t.value);c.meta.data=toISO(todayDn());c.meta.ts=Date.now();}
  else if(id==='f-valor')c.fac.valor=num(t.value);
  else if(id==='f-dia')c.fac.dia=clamp(parseInt(t.value)||1,1,31);
  else if(id==='f-ini')c.fac.ini=t.value;
  else if(id==='f-fim')c.fac.fim=t.value;
  else if(t.dataset.f){
    const row=t.closest('[data-fix]'),f=(c[row.dataset.grp||'fixas']||[]).find(x=>x.id===row.dataset.fix);if(!f)return;
    if(t.dataset.f==='cat')f.cat=t.value;else if(t.dataset.f==='nome'){f.nome=t.value.trim();if(!f.cat&&row.dataset.grp!=='recorrentes'){}}else if(t.dataset.f==='dia')f.dia=clamp(parseInt(t.value)||1,1,31);else f.valor=num(t.value);
  }else ch=false;
  if(ch){save('cfg');toast('Salvo.');}
});

updateSub();
render();
initStore();
</script>
